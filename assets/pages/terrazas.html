document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#cdde00\">Secretaría de Obras Públicas y Desarrollo Urbano · Municipio de Oaxaca de Juárez<\u002Fp>\n    <h1 style=\"margin:0;font-family:'Montserrat',sans-serif;font-weight:700;font-size:30px;line-height:1.12;letter-spacing:-.01em\">Regulariza tu terraza en el Centro Histórico<\u002Fh1>\n    <p style=\"margin:9px 0 0;font-size:14px;line-height:1.45;max-width:60ch;color:#dceae2\">Usar la azotea como terraza comercial lleva cinco pasos, y van en orden: cada uno depende del anterior. Arma una sola carpeta y ve sumando lo que obtengas.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"height:4px;flex:none;background:linear-gradient(90deg,#cdde00,#5c6b00)\"><\u002Fdiv>\n\n  <div style=\"padding:22px 44px 0\">\n    <p style=\"margin:0 0 10px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5c6b00\">Antes de empezar · ubica tu zona<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n      <div style=\"background:#f6f1ef;border-left:4px solid #265b4d;padding:12px 14px\">\n        <p style=\"margin:0 0 3px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;color:#265b4d\">Zona de Monumentos<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.4;color:#4a5259\">Intervienen el <strong>INAH y el Municipio<\u002Fstrong>. Además de los trámites municipales necesitas los pasos ante el INAH.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#f6f1ef;border-left:4px solid #5c6b00;padding:12px 14px\">\n        <p style=\"margin:0 0 3px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;color:#5c6b00\">Zona de Transición<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.4;color:#4a5259\">Interviene sólo el <strong>Municipio<\u002Fstrong>. Si no sabes en qué zona estás, pregúntalo al tramitar el alineamiento en la DCPH.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:20px 44px 0;display:grid;gap:11px\">\n    <p style=\"margin:0;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5c6b00\">Los cinco pasos, en orden<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:38px 1fr;gap:0 14px;align-items:start\">\n      <div style=\"width:34px;height:34px;border-radius:50%;background:#265b4d;color:#fff;display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px\">1<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #e6e1de;padding-bottom:11px\">\n        <p style=\"margin:0 0 3px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#23282e\">Alineamiento, número oficial y uso de suelo<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.45;color:#4a5259\"><strong>DCPH — Murguía 800.<\u002Fstrong> Sales con el dictamen de alineamiento, la constancia de número oficial y la licencia de uso de suelo vigente. Guarda <strong>dos juegos de copias<\u002Fstrong> de cada uno para la carpeta.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:38px 1fr;gap:0 14px;align-items:start\">\n      <div style=\"width:34px;height:34px;border-radius:50%;background:#265b4d;color:#fff;display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px\">2<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #e6e1de;padding-bottom:11px\">\n        <p style=\"margin:0 0 3px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#23282e\">Solicita la inspección del inmueble<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.45;color:#4a5259\"><strong>INAH — Murguía 800.<\u002Fstrong> Escrito simple al Mtro. Eduardo Barajas Mendoza, con atención al Antrop. José Manuel Bañuelos Ledesma, más copia del alineamiento vigente. Te notifican fecha y hora: deben estar presentes el propietario y el DRO.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:38px 1fr;gap:0 14px;align-items:start\">\n      <div style=\"width:34px;height:34px;border-radius:50%;background:#265b4d;color:#fff;display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px\">3<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #e6e1de;padding-bottom:11px\">\n        <p style=\"margin:0 0 3px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#23282e\">Recibe la inspección y conserva la minuta<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.45;color:#4a5259\">En la visita se levanta una minuta con observaciones. <strong>Guárdala:<\u002Fstrong> define cómo debe diseñarse tu proyecto ejecutivo del paso 4.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:38px 1fr;gap:0 14px;align-items:start\">\n      <div style=\"width:34px;height:34px;border-radius:50%;background:#265b4d;color:#fff;display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px\">4<\u002Fdiv>\n      <div style=\"border-bottom:1px solid #e6e1de;padding-bottom:11px\">\n        <p style=\"margin:0 0 3px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#23282e\">Proyecto ejecutivo y licencia de obra mayor<\u002Fp>\n        <p style=\"margin:0 0 6px;font-size:13px;line-height:1.45;color:#4a5259\"><strong>Obras Públicas — Murguía 800.<\u002Fstrong> Tienes <strong>30 días naturales<\u002Fstrong> para ingresar los requisitos. El dictamen de la licencia tarda hasta <strong>2 meses<\u002Fstrong>.<\u002Fp>\n        <p style=\"margin:0;background:#fbf3df;border-left:4px solid #cdde00;padding:8px 11px;font-size:12.5px;line-height:1.4;color:#5c4a1a\">Si no solicitas la licencia, el Municipio pide a Economía suspender la licencia de operaciones, procede la suspensión municipal y del INAH, y regresas al paso 3. <strong>Sin licencia no puedes operar la terraza.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:38px 1fr;gap:0 14px;align-items:start\">\n      <div style=\"width:34px;height:34px;border-radius:50%;background:#265b4d;color:#fff;display:grid;place-items:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px\">5<\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 3px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#23282e\">Constancia del INAH y factibilidad de uso de suelo comercial<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.45;color:#4a5259\"><strong>INAH — Pino Suárez 715<\u002Fstrong> (escrito simple al Antrop. José Manuel Bañuelos Ledesma, at'n Arq. Elías Lucero García) y <strong>DCPH — Murguía 800<\u002Fstrong> para la factibilidad de uso de suelo comercial de inicio de operaciones. Guarda dos copias.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:auto;padding:16px 44px 20px\">\n    <div style=\"background:#f6f1ef;padding:13px 16px;display:grid;gap:6px\">\n      <p style=\"margin:0;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;color:#265b4d\">Los montos de derechos varían según la tarifa vigente: confírmalos en caja al tramitar.<\u002Fp>\n      <p style=\"margin:0;font-size:11.5px;color:#4a5259\">Fundamento: Reglamento General de Aplicación del Plan Parcial del Centro Histórico de la Ciudad de Oaxaca de Juárez (versión 26-08-25). Murguía 800, Centro Histórico, CP 68000 · (951) 51 547 77 / 51 5 58 24 · Página 1 de 3<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" style=\"font-family:'Nunito Sans',sans-serif;color:#23282e;background:#fff;display:flex;flex-direction:column\">\n  <div style=\"background:#265b4d;color:#fff;padding:20px 44px 18px\">\n    <p style=\"margin:0 0 6px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#cdde00\">Checklist de la carpeta<\u002Fp>\n    <h2 style=\"margin:0;font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;line-height:1.15\">Qué llevar en cada paso<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"height:4px;flex:none;background:linear-gradient(90deg,#cdde00,#5c6b00)\"><\u002Fdiv>\n\n  <div style=\"padding:20px 44px 0;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start\">\n    <div>\n      <p style=\"margin:0 0 8px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:#265b4d\">Paso 1 · DCPH, alineamiento<\u002Fp>\n      <div style=\"display:grid;gap:5px;font-size:12px;line-height:1.4;color:#4a5259\">\n        <p style=\"margin:0\">☐ Formato Único del Centro Histórico (se compra en cajas o se descarga de la página del municipio).<\u002Fp>\n        <p style=\"margin:0\">☐ Copia de pago predial vigente.<\u002Fp>\n        <p style=\"margin:0\">☐ Copia de identificación oficial del o los propietarios.<\u002Fp>\n        <p style=\"margin:0\">☐ Copia legible de la escritura inscrita en el IFREO.<\u002Fp>\n        <p style=\"margin:0\">☐ 4 fotos a color en papel (2 exteriores de fachada completa + 2 interiores), pegadas en hoja carta.<\u002Fp>\n        <p style=\"margin:0\">☐ Pago de derechos (tarifa vigente, en caja).<\u002Fp>\n        <p style=\"margin:0\">☐ Croquis de ubicación con las medidas de la escritura, firmado por los propietarios o el representante legal (anexa copia del poder notarial).<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:8px 0 0;background:#f6f1ef;padding:9px 11px;font-size:11.5px;line-height:1.4;color:#4a5259\">El croquis debe traer: calles que limitan la manzana, distancia de las dos esquinas a los linderos, medidas de los frentes y de las banquetas, medidas de los linderos interiores, orientación, diagonales, área del predio, área de construcción, área de locales comerciales y número de niveles.<\u002Fp>\n\n      <p style=\"margin:16px 0 8px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:#265b4d\">Paso 5 · DCPH, factibilidad comercial<\u002Fp>\n      <div style=\"display:grid;gap:5px;font-size:12px;line-height:1.4;color:#4a5259\">\n        <p style=\"margin:0\">☐ Formato oficial de la DCPH requisitado, original y dos copias.<\u002Fp>\n        <p style=\"margin:0\">☐ Copia de pago predial vigente.<\u002Fp>\n        <p style=\"margin:0\">☐ Copia de credencial para votar del solicitante.<\u002Fp>\n        <p style=\"margin:0\">☐ Copia de credencial para votar del propietario del predio.<\u002Fp>\n        <p style=\"margin:0\">☐ 4 fotografías (2 exteriores + 2 interiores) en papel, pegadas en hoja carta.<\u002Fp>\n        <p style=\"margin:0\">☐ Copia del contrato de arrendamiento o comodato (original para cotejo).<\u002Fp>\n        <p style=\"margin:0\">☐ Copia del acta constitutiva si eres persona moral (original para cotejo).<\u002Fp>\n        <p style=\"margin:0\">☐ Copia de la escritura si quien emprende el negocio es el propietario.<\u002Fp>\n        <p style=\"margin:0\">☐ Croquis de ubicación.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"margin:0 0 8px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:#265b4d\">Paso 4 · Licencia de obra mayor<\u002Fp>\n      <div style=\"display:grid;gap:5px;font-size:12px;line-height:1.4;color:#4a5259\">\n        <p style=\"margin:0\">☐ 1 juego de planos del proyecto ejecutivo con especificaciones técnicas, proyecto estructural y dictamen estructural con su memoria, indicando circulaciones, mobiliario y cantidad máxima de ocupantes. Firmados por propietarios o representante, el o la DRO y el responsable de seguridad estructural, ambos con registro vigente.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 juegos de memoria descriptiva y especificaciones, firmadas.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 juegos de memoria de cálculo estructural en original + 2 copias de la cédula profesional.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 juegos de fotografías referenciadas de alta resolución: 4 de interiores, 4 del área a intervenir y 4 de perspectiva de fachada, pegadas en hoja carta y referidas a un plano de ubicación.<\u002Fp>\n        <p style=\"margin:0\">☐ Dictámenes técnicos en original sobre la situación estructural actual, firmados por el o la DRO o el responsable de seguridad estructural.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 copias del documento que acredite tu personalidad jurídica, si actúas como representante o apoderado.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 juegos de copias de la escritura del inmueble.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 copias de la identificación oficial del propietario.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 copias del pago predial del ejercicio fiscal en curso.<\u002Fp>\n        <p style=\"margin:0\">☐ Original y copia del pago de derechos.<\u002Fp>\n      <\u002Fdiv>\n\n      <p style=\"margin:16px 0 8px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:#5c6b00\">Dictámenes obligatorios de la carpeta<\u002Fp>\n      <div style=\"display:grid;gap:5px;font-size:12px;line-height:1.4;color:#4a5259\">\n        <p style=\"margin:0\">☐ 2 copias del dictamen de <strong>Protección Civil Municipal<\u002Fstrong> — Crisantemos 109, Col. Reforma.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 copias del dictamen y la autorización de la <strong>SMAGH<\u002Fstrong> — 3a privada de Puerto Escondido 102, Col. Eliseo Jiménez Ruíz.<\u002Fp>\n        <p style=\"margin:0\">☐ 2 copias del dictamen de la <strong>Unidad Verificadora<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:auto;padding:16px 44px 20px\">\n    <p style=\"margin:0;background:#f6f1ef;padding:12px 16px;font-size:11.5px;line-height:1.45;color:#4a5259\">Murguía 800, Centro Histórico, CP 68000 · (951) 51 547 77 / 51 5 58 24 · Página 2 de 3<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" style=\"font-family:'Nunito Sans',sans-serif;color:#23282e;background:#fff;display:flex;flex-direction:column\">\n  <div style=\"background:#265b4d;color:#fff;padding:20px 44px 18px\">\n    <p style=\"margin:0 0 6px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#cdde00\">Directorio y glosario<\u002Fp>\n    <h2 style=\"margin:0;font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;line-height:1.15\">A dónde ir y qué significa cada sigla<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"height:4px;flex:none;background:linear-gradient(90deg,#cdde00,#5c6b00)\"><\u002Fdiv>\n\n  <div style=\"padding:24px 44px 0\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start\">\n      <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:12px\">\n        <sc-raw-thead><sc-raw-tr>\n          <sc-raw-th style=\"text-align:left;padding:7px 10px;background:#f6f1ef;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#265b4d;border-bottom:1px solid #e6e1de\">Oficina<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;padding:7px 10px;background:#f6f1ef;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#265b4d;border-bottom:1px solid #e6e1de\">Dirección<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#23282e\">DCPH — alineamiento y factibilidades<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#4a5259\">Murguía 800, Centro Histórico<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#23282e\">INAH — solicitud de inspección<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#4a5259\">Murguía 800, Centro<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#23282e\">INAH — constancia y antecedentes<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#4a5259\">Pino Suárez 715, Centro<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#23282e\">Protección Civil Municipal<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border-bottom:1px solid #efeae7;color:#4a5259\">Crisantemos 109, Col. Reforma<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:7px 10px;color:#23282e\">SMAGH<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;color:#4a5259\">3a priv. de Puerto Escondido 102, Col. Eliseo Jiménez Ruíz<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <div style=\"display:grid;gap:4px;font-size:12px;line-height:1.4;color:#4a5259\">\n        <p style=\"margin:0\"><strong style=\"color:#23282e\">DCPH<\u002Fstrong> — Dirección del Centro y Patrimonio Histórico (Municipio).<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"color:#23282e\">INAH<\u002Fstrong> — Instituto Nacional de Antropología e Historia.<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"color:#23282e\">DRO<\u002Fstrong> — Director Responsable de Obra.<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"color:#23282e\">IFREO<\u002Fstrong> — Instituto de la Función Registral del Estado de Oaxaca.<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"color:#23282e\">SMAGH<\u002Fstrong> — dependencia que emite el dictamen y la autorización ambiental.<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"color:#23282e\">Unidad Verificadora<\u002Fstrong> — organismo que emite el dictamen de verificación.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:26px 44px 0\">\n    <p style=\"margin:0 0 10px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5c6b00\">Tres cosas que conviene que sepas<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px\">\n      <div style=\"border-top:3px solid #265b4d;padding-top:10px\">\n        <p style=\"margin:0 0 4px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:#23282e\">Los pasos no se saltan<\u002Fp>\n        <p style=\"margin:0;font-size:12px;line-height:1.45;color:#4a5259\">Cada uno pide el resultado del anterior. Si llegas al paso 4 sin la minuta de la inspección, el proyecto se rehace.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid #265b4d;padding-top:10px\">\n        <p style=\"margin:0 0 4px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:#23282e\">Una sola carpeta<\u002Fp>\n        <p style=\"margin:0;font-size:12px;line-height:1.45;color:#4a5259\">Ve sumando lo que obtengas en cada ventanilla. Casi todo se pide en dos juegos de copias: sácalos desde el principio.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid #cdde00;padding-top:10px\">\n        <p style=\"margin:0 0 4px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:#23282e\">Los montos se confirman en caja<\u002Fp>\n        <p style=\"margin:0;font-size:12px;line-height:1.45;color:#4a5259\">Los derechos varían según la tarifa vigente, así que no vienen en esta guía. Pregúntalos al momento de tramitar.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:auto;padding:16px 44px 20px\">\n    <p style=\"margin:0;background:#f6f1ef;padding:12px 16px;font-size:11.5px;line-height:1.45;color:#4a5259\">Unidad de Mejora Regulatoria · Secretaría de Obras Públicas y Desarrollo Urbano, Municipio de Oaxaca de Juárez 2025–2027. Murguía 800, Centro Histórico, CP 68000 · (951) 51 547 77 / 51 5 58 24. Orientación ciudadana: no sustituye la resolución de la autoridad. Página 3 de 3<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
