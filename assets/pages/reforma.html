document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"max-width:1140px;margin:0 auto;font-size:13.5px;color:#5c6772;display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n      <a href=\"../../index.html\" target=\"_top\">Inicio</a><span>›</span>\n      <a href=\"../../index.html#costos\" target=\"_top\">Ley de Ingresos 2026</a><span>›</span>\n      <span>Reforma que bajó los costos</span>\n    </div>\n  </div>\n\n  <section style=\"background:linear-gradient(165deg,#265b4d 0%,#1c4a3d 100%);color:#fff;padding:52px 20px 46px\">\n    <div style=\"max-width:900px;margin:0 auto\">\n      <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#cdde00;margin-bottom:14px\">Dictamen 1142 · Expediente 1170</div>\n      <h1 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:42px;line-height:1.15;margin:0 0 16px;letter-spacing:-.4px\">La primera Ley de Ingresos que baja, en lugar de subir</h1>\n      <p style=\"font-size:18.5px;line-height:1.55;margin:0 0 26px;max-width:700px;color:rgba(255,255,255,.9);text-wrap:pretty\">El 19 de marzo de 2026, el Congreso del Estado aprobó con enfoque de justicia fiscal una reforma a la Ley de Ingresos del Municipio: un esfuerzo institucional para aliviar la economía de las familias y de quienes sostienen la actividad económica de la capital. Aquí te explicamos, sin lenguaje técnico, qué bajó, cuánto y qué hacer para aprovecharlo. Los indicadores corresponden al dictamen completo; esta página desarrolla los bloques principales.</p>\n      <div style=\"background:rgba(255,255,255,.1);border-left:3px solid #cdde00;border-radius:0 8px 8px 0;padding:18px 22px;max-width:700px\">\n        <p style=\"margin:0;font-size:17px;line-height:1.5;color:#fff;text-wrap:pretty\">La idea de fondo: <strong style=\"color:#cdde00\">que contribuya más gente pagando menos cada una</strong>. Cuando el trámite es accesible, el negocio se regulariza, la mercancía circula y el municipio recauda mejor sin exprimir a nadie.</p>\n      </div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:26px;margin-top:32px\">\n        <div>\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:30px;color:#cdde00;line-height:1\">6</div>\n          <div style=\"font-size:13.5px;color:rgba(255,255,255,.85);margin-top:4px\">artículos reformados</div>\n        </div>\n        <div>\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:30px;color:#cdde00;line-height:1\">19</div>\n          <div style=\"font-size:13.5px;color:rgba(255,255,255,.85);margin-top:4px\">conceptos con cuota menor</div>\n        </div>\n        <div>\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:30px;color:#cdde00;line-height:1\">3</div>\n          <div style=\"font-size:13.5px;color:rgba(255,255,255,.85);margin-top:4px\">niveles de multa eliminados</div>\n        </div>\n        <div>\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:30px;color:#cdde00;line-height:1\">80%</div>\n          <div style=\"font-size:13.5px;color:rgba(255,255,255,.85);margin-top:4px\">la baja más grande</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"background:#f6f1ef;border-bottom:1px solid #e7ded9;padding:26px 20px\">\n    <div style=\"max-width:1140px;margin:0 auto\">\n      <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5c6772;margin-bottom:14px\">Ir directo a</div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <a href=\"#casa\" style=\"background:#fff;border:1px solid #e7ded9;border-radius:20px;padding:9px 17px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13.5px;color:#265b4d\" style-hover=\"border-color:#265b4d;text-decoration:none\">Comprar o heredar una casa</a>\n        <a href=\"#predial\" style=\"background:#fff;border:1px solid #e7ded9;border-radius:20px;padding:9px 17px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13.5px;color:#265b4d\" style-hover=\"border-color:#265b4d;text-decoration:none\">Predial justo</a>\n        <a href=\"#mercados\" style=\"background:#fff;border:1px solid #e7ded9;border-radius:20px;padding:9px 17px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13.5px;color:#265b4d\" style-hover=\"border-color:#265b4d;text-decoration:none\">Locales de mercado</a>\n        <a href=\"#descarga\" style=\"background:#fff;border:1px solid #e7ded9;border-radius:20px;padding:9px 17px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13.5px;color:#265b4d\" style-hover=\"border-color:#265b4d;text-decoration:none\">Descargar mercancía</a>\n        <a href=\"#multas\" style=\"background:#fff;border:1px solid #e7ded9;border-radius:20px;padding:9px 17px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13.5px;color:#265b4d\" style-hover=\"border-color:#265b4d;text-decoration:none\">Multas eliminadas</a>\n        <a href=\"#descuentos\" style=\"background:#fff;border:1px solid #e7ded9;border-radius:20px;padding:9px 17px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13.5px;color:#265b4d\" style-hover=\"border-color:#265b4d;text-decoration:none\">Descuentos</a>\n        <a href=\"#yapague\" style=\"background:#fff;border:1px solid #e7ded9;border-radius:20px;padding:9px 17px;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13.5px;color:#265b4d\" style-hover=\"border-color:#265b4d;text-decoration:none\">Ya pagué de más</a>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"casa\" style=\"background:#fff;padding:52px 20px;border-bottom:1px solid #e7ded9\">\n    <div style=\"max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:36px;align-items:start\">\n      <div>\n        <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5c6b00;margin-bottom:10px\">Artículo 51 · Traslación de dominio</div>\n        <h2 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;margin:0 0 14px;color:#1c4a3d;letter-spacing:-.3px\">Dar certeza a tu patrimonio cuesta menos</h2>\n        <p style=\"margin:0 0 14px;font-size:16.5px;color:#5c6772;text-wrap:pretty\">Escriturar es lo que convierte una casa en patrimonio: permite heredarla sin pleitos, usarla como garantía y venderla con seguridad. Cuando una propiedad cambia de dueño —por compra, herencia, donación o adjudicación— se paga el impuesto sobre traslación de dominio, que se calcula por tramos según el valor del inmueble.</p>\n        <p style=\"margin:0 0 14px;font-size:16.5px;color:#5c6772;text-wrap:pretty\">La reforma hizo dos cosas: <strong style=\"color:#23282e\">redujo la tabla de 24 rangos a 12</strong>, lo que la vuelve mucho más fácil de leer, y <strong style=\"color:#23282e\">bajó la tasa máxima de 5.40% a 3.50%</strong>.</p>\n        <p style=\"margin:0;font-size:16.5px;color:#5c6772;text-wrap:pretty\">Los tramos de menor valor —donde está la mayoría de las viviendas del municipio— conservan su tasa. La baja se concentra en los tramos que antes escalaban demasiado rápido, y con ella se generan condiciones más accesibles para cumplir y mayor certeza jurídica para invertir en la ciudad.</p>\n      </div>\n      <div>\n        <div style=\"background:#fff;border:1px solid #e7ded9;border-radius:12px;padding:26px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#5c6772;margin-bottom:16px\">Tasa marginal más alta</div>\n          <div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:38px;color:#98a1ab;text-decoration:line-through;line-height:1\">5.40%</div>\n              <div style=\"font-size:12.5px;color:#5c6772;margin-top:4px\">Antes</div>\n            </div>\n            <div style=\"font-size:22px;color:#5c6772\">→</div>\n            <div>\n              <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:38px;color:#265b4d;line-height:1\">3.50%</div>\n              <div style=\"font-size:12.5px;color:#5c6772;margin-top:4px\">Ahora</div>\n            </div>\n          </div>\n        </div>\n        <div style=\"background:#fff;border:1px solid #e7ded9;border-radius:12px;padding:26px;box-shadow:0 2px 8px rgba(0,0,0,.06)\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#5c6772;margin-bottom:16px\">La tabla se simplificó</div>\n          <div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:38px;color:#98a1ab;text-decoration:line-through;line-height:1\">24</div>\n              <div style=\"font-size:12.5px;color:#5c6772;margin-top:4px\">rangos de valor</div>\n            </div>\n            <div style=\"font-size:22px;color:#5c6772\">→</div>\n            <div>\n              <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:38px;color:#265b4d;line-height:1\">12</div>\n              <div style=\"font-size:12.5px;color:#5c6772;margin-top:4px\">rangos de valor</div>\n            </div>\n          </div>\n        </div>\n        <div style=\"background:#f4f8ec;border-radius:10px;padding:18px 20px;margin-top:16px\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#1c4a3d;margin-bottom:6px\">¿Qué hago?</div>\n          <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Nada por adelantado: el notario o la Tesorería aplican la tabla nueva al calcular tu impuesto. Solo verifica que en tu cálculo aparezca la tasa vigente 2026.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"predial\" style=\"background:#f6f1ef;padding:52px 20px;border-bottom:1px solid #e7ded9\">\n    <div style=\"max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:36px;align-items:start\">\n      <div>\n        <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5c6b00;margin-bottom:10px\">Artículo 62 · Predial</div>\n        <h2 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;margin:0 0 14px;color:#1c4a3d;letter-spacing:-.3px\">Puedes corregir un predial que subió sin razón</h2>\n        <p style=\"margin:0 0 14px;font-size:16.5px;color:#5c6772;text-wrap:pretty\">Entre 2022 y 2024 el valor catastral de muchos predios se actualizó al alza desde el escritorio. En numerosos casos ocurrió sin que el dueño hubiera vendido, comprado ni modificado nada: el recibo subió aunque la casa siguiera igual, y ese incremento desproporcionado pegó directo a la economía de vecinas y vecinos.</p>\n        <p style=\"margin:0 0 14px;font-size:16.5px;color:#5c6772;text-wrap:pretty\">La reforma abre una puerta: <strong style=\"color:#23282e\">puedes solicitar una nueva valuación aplicando las tablas de valores anteriores a esa actualización</strong>. Si procede, tu predial baja.</p>\n        <p style=\"margin:0;font-size:16.5px;color:#5c6772;text-wrap:pretty\">Es un trámite a solicitud del contribuyente: no se aplica solo, tienes que pedirlo. Corregirlo es parte de dejar atrás prácticas fiscales que castigaban a quien sí cumple.</p>\n      </div>\n      <div style=\"background:#fff;border:1px solid #e7ded9;border-radius:12px;padding:26px;box-shadow:0 2px 8px rgba(0,0,0,.06)\">\n        <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;color:#1c4a3d;margin-bottom:18px\">¿Aplica en tu caso?</div>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start\">\n            <div style=\"width:22px;height:22px;border-radius:50%;background:#cdde00;color:#1c4a3d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;margin-top:2px\">✓</div>\n            <div style=\"font-size:15px;color:#23282e;text-wrap:pretty\">El valor de tu predio se actualizó en <strong>2022, 2023 o 2024</strong> y no hubo compraventa ni traslación de dominio.</div>\n          </div>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\">\n            <div style=\"width:22px;height:22px;border-radius:50%;background:#cdde00;color:#1c4a3d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;margin-top:2px\">✓</div>\n            <div style=\"font-size:15px;color:#23282e;text-wrap:pretty\">Necesitas <strong>rectificar datos catastrales</strong> registrados en 0.0 m² de superficie de terreno o construcción.</div>\n          </div>\n          <div style=\"display:flex;gap:12px;align-items:flex-start\">\n            <div style=\"width:22px;height:22px;border-radius:50%;background:#cdde00;color:#1c4a3d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;margin-top:2px\">✓</div>\n            <div style=\"font-size:15px;color:#23282e;text-wrap:pretty\">Te estás <strong>incorporando al padrón catastral</strong> por primera vez.</div>\n          </div>\n        </div>\n        <div style=\"background:#f4f8ec;border-radius:10px;padding:18px 20px;margin-top:22px\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#1c4a3d;margin-bottom:6px\">¿Qué hago?</div>\n          <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Acude a Catastro Municipal con tu identificación, el recibo de predial más reciente y el documento que acredite la propiedad. Solicita por escrito la valuación con tablas anteriores citando el artículo 62.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"mercados\" style=\"background:#fff;padding:52px 20px;border-bottom:1px solid #e7ded9\">\n    <div style=\"max-width:1140px;margin:0 auto\">\n      <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5c6b00;margin-bottom:10px\">Artículos 75 y 77 · Mercados públicos</div>\n      <h2 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;margin:0 0 14px;color:#1c4a3d;letter-spacing:-.3px\">Los mercados, corazón de la economía de la capital</h2>\n      <p style=\"margin:0 0 28px;font-size:16.5px;color:#5c6772;max-width:780px;text-wrap:pretty\">En los mercados públicos trabajan miles de familias, y muchas heredan su puesto de una generación a otra. Bajaron tanto las <strong style=\"color:#23282e\">concesiones</strong> (el derecho a ocupar un espacio) como las <strong style=\"color:#23282e\">cesiones de derechos</strong> (pasar tu espacio a otra persona). Las cesiones bajaron hasta 38%: era el trámite que más locatarios dejaban sin hacer por su costo, quedándose en la irregularidad y sin poder defender su lugar.</p>\n\n      <div style=\"border:1px solid #e7ded9;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,2fr) auto auto auto auto\">\n          <div style=\"grid-column:1/-1;display:grid;grid-template-columns:subgrid;background:#f6f1ef;font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5c6772;border-bottom:1px solid #e7ded9\">\n            <div style=\"padding:11px 20px\">Concepto</div>\n            <div style=\"padding:11px 12px;text-align:right\">Antes</div>\n            <div style=\"padding:11px 12px;text-align:right\">Ahora</div>\n            <div style=\"padding:11px 12px;text-align:right\">Baja</div>\n            <div style=\"padding:11px 20px 11px 12px;text-align:right\">Ahorro</div>\n          </div>\n          <sc-for list=\"{{ mercados }}\" as=\"f\" hint-placeholder-count=\"7\">\n            <div style=\"grid-column:1/-1;display:grid;grid-template-columns:subgrid;border-bottom:1px solid #f2f2f2;align-items:center;background:{{ f.fondo }}\">\n              <div style=\"padding:13px 20px;font-size:14.5px;text-wrap:pretty\">{{ f.concepto }}</div>\n              <div style=\"padding:13px 12px;text-align:right;color:#98a1ab;text-decoration:line-through;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ f.antes }}</div>\n              <div style=\"padding:13px 12px;text-align:right;font-family:'Montserrat',sans-serif;font-weight:700;color:#265b4d;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ f.ahora }}</div>\n              <div style=\"padding:13px 12px;text-align:right;font-size:13px;font-weight:700;color:#5c6b00;white-space:nowrap\">{{ f.baja }}</div>\n              <div style=\"padding:13px 20px 13px 12px;text-align:right;font-size:13.5px;color:#5c6772;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ f.ahorro }}</div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n      <div style=\"background:#f4f8ec;border-radius:10px;padding:18px 22px\">\n        <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#1c4a3d;margin-bottom:6px\">¿Qué hago?</div>\n        <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Si tenías pendiente regularizar una cesión de derechos, este es el momento: la cuota de cesión de caseta pasó de 17 a 12 UMA. Con el papel en orden puedes acreditar tu espacio y transmitirlo a tu familia. El trámite se hace en la Dirección de Mercados con el contrato vigente y la identificación de ambas partes.</p>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"descarga\" style=\"background:#f6f1ef;padding:52px 20px;border-bottom:1px solid #e7ded9\">\n    <div style=\"max-width:1140px;margin:0 auto\">\n      <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5c6b00;margin-bottom:10px\">Artículo 76 · Carga y descarga a granel</div>\n      <h2 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;margin:0 0 14px;color:#1c4a3d;letter-spacing:-.3px\">Abastecer la ciudad cuesta hasta 64% menos</h2>\n      <p style=\"margin:0 0 28px;font-size:16.5px;color:#5c6772;max-width:780px;text-wrap:pretty\">Este es el artículo con la reducción más generalizada: <strong style=\"color:#23282e\">todas las tarifas bajaron y varias quedaron exactamente a la mitad</strong>. Beneficia a quien mueve el alimento de la capital: productores del Valle que traen su cosecha, transportistas y comerciantes mayoristas. Menos costo por descargar es menos costo en el precio final que paga cada hogar.</p>\n\n      <div style=\"border:1px solid #e7ded9;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px;background:#fff\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,2fr) auto auto auto auto\">\n          <div style=\"grid-column:1/-1;display:grid;grid-template-columns:subgrid;background:#f6f1ef;font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5c6772;border-bottom:1px solid #e7ded9\">\n            <div style=\"padding:11px 20px\">Concepto</div>\n            <div style=\"padding:11px 12px;text-align:right\">Antes</div>\n            <div style=\"padding:11px 12px;text-align:right\">Ahora</div>\n            <div style=\"padding:11px 12px;text-align:right\">Baja</div>\n            <div style=\"padding:11px 20px 11px 12px;text-align:right\">Ahorro</div>\n          </div>\n          <sc-for list=\"{{ descarga }}\" as=\"f\" hint-placeholder-count=\"9\">\n            <div style=\"grid-column:1/-1;display:grid;grid-template-columns:subgrid;border-bottom:1px solid #f2f2f2;align-items:center;background:{{ f.fondo }}\">\n              <div style=\"padding:13px 20px;font-size:14.5px;text-wrap:pretty\">{{ f.concepto }}</div>\n              <div style=\"padding:13px 12px;text-align:right;color:#98a1ab;text-decoration:line-through;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ f.antes }}</div>\n              <div style=\"padding:13px 12px;text-align:right;font-family:'Montserrat',sans-serif;font-weight:700;color:#265b4d;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ f.ahora }}</div>\n              <div style=\"padding:13px 12px;text-align:right;font-size:13px;font-weight:700;color:#5c6b00;white-space:nowrap\">{{ f.baja }}</div>\n              <div style=\"padding:13px 20px 13px 12px;text-align:right;font-size:13.5px;color:#5c6772;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ f.ahorro }}</div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n      <div style=\"background:#fff;border-radius:10px;padding:18px 22px\">\n        <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#1c4a3d;margin-bottom:6px\">¿Qué hago?</div>\n        <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Si descargas de forma habitual, te conviene un convenio de tres meses o más: además de la tarifa ya reducida tienes <strong style=\"color:#23282e\">30% de descuento por pago anticipado</strong>.</p>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"multas\" style=\"background:#fff;padding:52px 20px;border-bottom:1px solid #e7ded9\">\n    <div style=\"max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:36px;align-items:start\">\n      <div>\n        <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5c6b00;margin-bottom:10px\">Artículo 78, fracción IX</div>\n        <h2 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;margin:0 0 14px;color:#1c4a3d;letter-spacing:-.3px\">Ya no se castiga con multas que crecían sin medida</h2>\n        <div style=\"font-size:14px;color:#5c6772;margin:-6px 0 14px\">Fracción IX · multas de 4 a 10 UMA</div>\n        <p style=\"margin:0 0 14px;font-size:16.5px;color:#5c6772;text-wrap:pretty\">Para quien vive de lo que vende en el día, perder la mercancía es perder el ingreso de la semana. Cuando la autoridad la aseguraba, la multa para recuperarla subía cada vez: la segunda ocasión costaba más que la primera, la tercera más que la segunda, y así.</p>\n        <p style=\"margin:0 0 14px;font-size:16.5px;color:#5c6772;text-wrap:pretty\">A partir de la segunda ocasión el monto ya no guardaba proporción con el valor de lo asegurado, así que mucha gente simplemente abandonaba su producto: una pérdida para la familia y para nadie una ganancia.</p>\n        <p style=\"margin:0;font-size:16.5px;color:#5c6772;text-wrap:pretty\"><strong style=\"color:#23282e\">Los tres niveles de multa escalonada —2ª, 3ª y 4ª ocasión— quedaron derogados.</strong> El aseguramiento sigue existiendo como medida, pero sin la multa creciente.</p>\n      </div>\n      <div style=\"background:#fff;border:1px solid #e7ded9;border-radius:12px;padding:26px;box-shadow:0 2px 8px rgba(0,0,0,.06)\">\n        <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#5c6772;margin-bottom:18px\">Lo que se eliminó</div>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid #f2f2f2\">\n            <div style=\"font-size:15px;color:#23282e\">Segunda ocasión</div>\n            <div style=\"text-align:right;white-space:nowrap\"><span style=\"color:#98a1ab;text-decoration:line-through;font-variant-numeric:tabular-nums\">4 UMA</span> <strong style=\"color:#265b4d;font-family:'Montserrat',sans-serif\">Sin cobro</strong></div>\n          </div>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid #f2f2f2\">\n            <div style=\"font-size:15px;color:#23282e\">Tercera ocasión</div>\n            <div style=\"text-align:right;white-space:nowrap\"><span style=\"color:#98a1ab;text-decoration:line-through;font-variant-numeric:tabular-nums\">7 UMA</span> <strong style=\"color:#265b4d;font-family:'Montserrat',sans-serif\">Sin cobro</strong></div>\n          </div>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px\">\n            <div style=\"font-size:15px;color:#23282e\">Cuarta ocasión y posteriores</div>\n            <div style=\"text-align:right;white-space:nowrap\"><span style=\"color:#98a1ab;text-decoration:line-through;font-variant-numeric:tabular-nums\">10 UMA</span> <strong style=\"color:#265b4d;font-family:'Montserrat',sans-serif\">Sin cobro</strong></div>\n          </div>\n        </div>\n        <div style=\"background:#f4f8ec;border-radius:10px;padding:18px 20px;margin-top:22px\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#1c4a3d;margin-bottom:6px\">¿Qué hago?</div>\n          <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Si te están requiriendo el pago de una de estas multas, cita el Dictamen 1142: quedaron derogadas. El cobro de aseguramiento ordinario por mercado sí sigue vigente.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"descuentos\" style=\"background:#f6f1ef;padding:52px 20px;border-bottom:1px solid #e7ded9\">\n    <div style=\"max-width:1140px;margin:0 auto\">\n      <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#5c6b00;margin-bottom:10px\">Beneficios vigentes en 2026</div>\n      <h2 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;margin:0 0 14px;color:#1c4a3d;letter-spacing:-.3px\">Apoyos para quien produce y trabaja en la capital</h2>\n      <p style=\"margin:0 0 28px;font-size:16.5px;color:#5c6772;max-width:780px;text-wrap:pretty\">Apoyos pensados para que regularizarse sea más barato que quedarse fuera. No se aplican en automático: hay que solicitarlos.</p>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:stretch\">\n        <div style=\"background:#fff;border:1px solid #e7ded9;border-radius:12px;padding:26px;box-shadow:0 2px 8px rgba(0,0,0,.06)\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:42px;color:#265b4d;line-height:1\">50%</div>\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;margin:10px 0 8px;color:#23282e\">Artesanía oaxaqueña</div>\n          <p style=\"margin:0 0 12px;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Hasta la mitad de descuento sobre la tarifa de comercio en vía pública para quien vende artesanía producida en Oaxaca: apoyo directo a los oficios que dan identidad a la ciudad.</p>\n          <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Se acredita al solicitar o renovar el permiso.</p>\n        </div>\n        <div style=\"background:#fff;border:1px solid #e7ded9;border-radius:12px;padding:26px;box-shadow:0 2px 8px rgba(0,0,0,.06)\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:42px;color:#265b4d;line-height:1\">30%</div>\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;margin:10px 0 8px;color:#23282e\">Convenios de carga</div>\n          <p style=\"margin:0 0 12px;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Descuento por pago anticipado en convenios de descarga de tres meses o más, para quien abastece los mercados cada semana.</p>\n          <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Se acumula con las tarifas ya reducidas del artículo 76.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"yapague\" style=\"background:#1c4a3d;color:#fff;padding:52px 20px\">\n    <div style=\"max-width:900px;margin:0 auto\">\n      <div style=\"font-family:'Montserrat',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#cdde00;margin-bottom:12px\">Artículo transitorio</div>\n      <h2 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:29px;margin:0 0 14px;letter-spacing:-.3px\">¿Ya pagaste la cuota anterior? Puedes recuperar la diferencia</h2>\n      <p style=\"margin:0 0 26px;font-size:17px;color:rgba(255,255,255,.9);max-width:720px;text-wrap:pretty\">Quien cumplió a tiempo no debe salir perdiendo. Si pagaste contribuciones del ejercicio 2026 antes de que entrara en vigor la reforma, y por eso no recibiste el beneficio de la cuota menor, tienes derecho a recuperar el excedente.</p>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px\">\n        <div style=\"background:rgba(255,255,255,.1);border-radius:12px;padding:22px\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#cdde00;margin-bottom:8px\">Opción 1 · Compensación</div>\n          <p style=\"margin:0;font-size:14.5px;color:rgba(255,255,255,.88);text-wrap:pretty\">Aplicar el excedente a cuenta de pagos futuros de la misma contribución. Es la vía más rápida.</p>\n        </div>\n        <div style=\"background:rgba(255,255,255,.1);border-radius:12px;padding:22px\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#cdde00;margin-bottom:8px\">Opción 2 · Devolución</div>\n          <p style=\"margin:0;font-size:14.5px;color:rgba(255,255,255,.88);text-wrap:pretty\">Solicitar que te regresen la diferencia pagada de más, conforme al procedimiento de la Tesorería.</p>\n        </div>\n        <div style=\"background:#cdde00;color:#1c4a3d;border-radius:12px;padding:22px\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;margin-bottom:8px\">Lo que necesitas</div>\n          <p style=\"margin:0;font-size:14.5px;text-wrap:pretty\">Tu recibo oficial de pago, identificación y un escrito señalando el concepto, el artículo y la fecha del pago.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"background:#fff;padding:44px 20px\">\n    <div style=\"max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start\">\n      <div style=\"background:#f6f1ef;border-radius:12px;padding:24px\">\n        <h3 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;margin:0 0 10px;color:#1c4a3d\">Datos del dictamen</h3>\n        <p style=\"margin:0;font-size:15px;color:#5c6772;text-wrap:pretty\">Dictamen 1142, expediente 1170, de la Comisión Permanente de Hacienda de la LXVI Legislatura del Congreso del Estado de Oaxaca. Aprobado el 19 de marzo de 2026. Reforma la Ley de Ingresos del Municipio de Oaxaca de Juárez para el Ejercicio Fiscal 2026.</p>\n      </div>\n      <div style=\"background:#f6f1ef;border-radius:12px;padding:24px\">\n        <h3 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;margin:0 0 10px;color:#1c4a3d\">Cómo se calculan los ahorros</h3>\n        <p style=\"margin:0;font-size:15px;color:#5c6772;text-wrap:pretty\">Las cuotas están en UMA. Los montos en pesos usan el valor diario de la UMA vigente en 2026: <strong style=\"color:#23282e\">$117.31</strong>. El ahorro mostrado es la diferencia entre la cuota anterior y la nueva, por una sola unidad de cobro.</p>\n      </div>\n      <div style=\"background:#f6f1ef;border-radius:12px;padding:24px\">\n        <h3 style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;margin:0 0 10px;color:#1c4a3d\">Consulta el catálogo completo</h3>\n        <p style=\"margin:0 0 14px;font-size:15px;color:#5c6772;text-wrap:pretty\">Los 2,233 conceptos con tarifa de la Ley de Ingresos, con su cuota en UMA y su equivalente en pesos, están en el catálogo buscable.</p>\n        <a href=\"../../index.html#costos\" target=\"_top\" style=\"display:inline-block;background:#265b4d;color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14.5px;padding:11px 20px;border-radius:7px\" style-hover=\"background:#1c4a3d;text-decoration:none\">Ir al catálogo de costos</a>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"background:#fdf8e8;border-top:1px solid #e7ded9;border-bottom:1px solid #e7ded9;padding:24px 20px\">\n    <div style=\"max-width:1140px;margin:0 auto;display:flex;gap:14px;align-items:flex-start\">\n      <div style=\"width:26px;height:26px;border-radius:50%;background:#a8842f;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;flex:0 0 auto\">!</div>\n      <p style=\"margin:0;font-size:14.5px;color:#5c6772;text-wrap:pretty\">Versión en validación por la Dirección de la Unidad de Mejora Regulatoria. Los importes provienen del texto reproducido en el Dictamen 1142 y deben cotejarse contra el Decreto publicado en el Periódico Oficial del Gobierno del Estado y el texto consolidado de la Ley, en particular los rangos del artículo 51 y las tarifas de los artículos 75 a 78.</p>\n    </div>\n  </section>\n\n  <section style=\"background:#fff;border-top:1px solid #e7ded9;padding:22px 20px\">\n    <div style=\"max-width:1140px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:44px;flex-wrap:wrap\">\n      <img src=\"5a9ebc3b-f82f-4a62-a080-25afac49d9cf\" alt=\"Oaxaca de Juárez · Gobierno Municipal 2025-2027\" style=\"height:52px;width:auto;display:block\">\n      <img src=\"a179a3ba-a58b-4ada-8291-3d4020ba51f6\" alt=\"Ciudad Limpia\" style=\"height:52px;width:auto;display:block\">\n      <img src=\"d545c98b-61ed-47c0-84d0-d843c23288b8\" alt=\"Vecinas y Vecinos Transformando Juntos la capital\" style=\"height:52px;width:auto;display:block\">\n    </div>\n  </section>\n\n  <footer style=\"background:#1c4a3d;color:rgba(255,255,255,.8);padding:36px 20px\">\n    <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start\">\n      <div>\n        <svg sc-camel-view-box=\"0 0 148 52\" style=\"height:38px;width:auto;display:block;margin-bottom:10px\" role=\"img\" aria-label=\"UMR\">\n          <rect x=\"10\" y=\"28\" width=\"6\" height=\"12\" fill=\"#3F5B52\"></rect>\n          <rect x=\"19\" y=\"20\" width=\"6\" height=\"20\" fill=\"#2E9C79\"></rect>\n          <rect x=\"28\" y=\"10\" width=\"6\" height=\"30\" fill=\"#4FD1A5\"></rect>\n          <text x=\"48\" y=\"40\" font-family=\"Archivo, 'Helvetica Neue', Arial, sans-serif\" font-size=\"38\" font-weight=\"800\" letter-spacing=\"-1.7\" fill=\"#FFFFFF\">UMR</text>\n        </svg>\n        <div style=\"font-size:13.5px\">Unidad de Mejora Regulatoria · Secretaría Técnica</div>\n        <div style=\"font-size:13.5px;margin-top:2px\">Municipio de Oaxaca de Juárez</div>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px\">\n        <a href=\"../../index.html\" target=\"_top\" style=\"color:#cdde00\">Portal de trámites y servicios</a>\n        <a href=\"../../index.html#costos\" target=\"_top\" style=\"color:#cdde00\">Ley de Ingresos 2026</a>\n        <a href=\"../../index.html#costos\" target=\"_top\" style=\"color:#cdde00\">Cómo verificar un costo</a>\n      </div>\n    </div>\n  </footer>\n</div>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;valorUma&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:117.31,&quot;min&quot;:50,&quot;max&quot;:300,&quot;step&quot;:0.01,&quot;unit&quot;:&quot;MXN&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cálculo&quot;}}\">\nconst MERCADOS = [\n  ['Concesión de caseta — Abasto, LULA\\'A, 20 de Noviembre, Benito Juárez y Democracia', 750, 715],\n  ['Concesión de puesto — Abasto, 20 de Noviembre, Benito Juárez y Democracia', 585, 550],\n  ['Concesión — otros mercados', 312, 277],\n  ['Cesión de derechos de caseta — Abasto, LULA\\'A, 20 de Noviembre y Benito Juárez', 17, 12],\n  ['Cesión de derechos de caseta — Democracia y otros mercados', 13, 8],\n  ['Instalación de caseta según puesto en zona de servicio (artículo 77)', 100, 44.5],\n  ['Desclausura en mercados (artículo 77)', 22.5, 20.5]\n];\n\nconst DESCARGA = [\n  ['Camioneta de 1 tonelada (por evento)', 0.67, 0.55],\n  ['Camioneta de 3 toneladas (por evento)', 0.90, 0.78],\n  ['Camión de mayor capacidad (por evento)', 1.89, 1.47],\n  ['Caja, costal o canasto (cada uno)', 0.05, 0.018],\n  ['Descarga por un lado (por evento)', 0.0092, 0.0046],\n  ['Carga por dos lados (por evento)', 0.0184, 0.0092],\n  ['Maleta chica de cebolla (cada una)', 0.0092, 0.0046],\n  ['Maleta grande de cebolla (cada una)', 0.0184, 0.0092]\n];\n\nclass Component extends DCLogic {\n  fila(row, i){\n    const uma = this.props.valorUma ?? 117.31;\n    const [concepto, antes, ahora] = row;\n    const num = (v) => v < 1 ? v.toString() : v.toLocaleString('es-MX', {maximumFractionDigits:3});\n    const dif = (antes - ahora) * uma;\n    return {\n      concepto,\n      antes: num(antes),\n      ahora: num(ahora),\n      baja: '−' + (((antes - ahora) / antes) * 100).toFixed(1) + '%',\n      ahorro: dif >= 0.01\n        ? '−' + dif.toLocaleString('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:2})\n        : '−' + dif.toLocaleString('es-MX', {style:'currency', currency:'MXN', minimumFractionDigits:4, maximumFractionDigits:4}),\n      fondo: i % 2 ? '#fbfbfa' : '#ffffff'\n    };\n  }\n\n  renderVals(){\n    return {\n      mercados: MERCADOS.map((r,i) => this.fila(r,i)),\n      descarga: DESCARGA.map((r,i) => this.fila(r,i))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n\n<script>\n(function(){\n  function umrReportHeight(){\n    try{\n      var h = Math.max(\n        document.documentElement.scrollHeight,\n        document.body ? document.body.scrollHeight : 0\n      );\n      if (h > 0) parent.postMessage({ umrResize: true, height: h }, '*');\n    }catch(e){}\n  }\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', umrReportHeight);\n  } else {\n    umrReportHeight();\n  }\n  window.addEventListener('load', umrReportHeight);\n  if ('ResizeObserver' in window) {\n    try{ new ResizeObserver(umrReportHeight).observe(document.body); }catch(e){}\n  }\n  // el bundler desempaqueta el contenido real después de 'load'; varios\n  // reintentos cortos cubren ese ajuste posterior sin depender de eventos propios.\n  [150, 400, 800, 1500, 2500].forEach(function(ms){ setTimeout(umrReportHeight, ms); });\n})();\n<\u002Fscript></body></html>"</script>
